<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galaxy Z Fold8 — fold study</title>
<!-- Onest is self-hosted (fontsource 5.3.1, OFL); three.js 0.160.0 is served from this folder. No third-party requests. -->
<style>
@font-face{font-family:"Onest";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/onest-400.woff2) format("woff2")}
@font-face{font-family:"Onest";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/onest-500.woff2) format("woff2")}
@font-face{font-family:"Onest";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/onest-600.woff2) format("woff2")}
</style>
<style>
:root{
  --bg-center:#F3F6F5; --bg-edge:#D8DFDD;
  --ink:#1D2523; --muted:#66726F; --line:rgba(29,37,35,.12);
  --surface:rgba(250,252,251,.72); --knob:#1D2523; --knob-ink:#FFFFFF;
  --track:rgba(29,37,35,.14);
  --font:"Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-center:#1E2524; --bg-edge:#0E1211;
    --ink:#E6EDEB; --muted:#8E9A97; --line:rgba(230,237,235,.12);
    --surface:rgba(24,30,29,.72); --knob:#E6EDEB; --knob-ink:#101514;
    --track:rgba(230,237,235,.16);
  }
}
:root[data-theme="dark"]{
  --bg-center:#1E2524; --bg-edge:#0E1211;
  --ink:#E6EDEB; --muted:#8E9A97; --line:rgba(230,237,235,.12);
  --surface:rgba(24,30,29,.72); --knob:#E6EDEB; --knob-ink:#101514;
  --track:rgba(230,237,235,.16);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;
  font-family:var(--font);color:var(--ink);
  background:radial-gradient(120% 90% at 50% 42%, var(--bg-center) 0%, var(--bg-edge) 100%);
  -webkit-font-smoothing:antialiased;
}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%;opacity:0;transition:opacity .5s ease}
#stage.ready canvas{opacity:1}

header{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 22px);left:26px;
  pointer-events:none;
}
header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em}
header p{margin:3px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.hint{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 24px);right:26px;
  font-size:12.5px;color:var(--muted);transition:opacity .6s ease;pointer-events:none;
}
.hint.gone{opacity:0}

.dock{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  display:flex;align-items:center;gap:18px;
  padding:12px 16px 12px 12px;
  background:var(--surface);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid var(--line);border-radius:22px;
  max-width:calc(100vw - 24px);
}
.play{
  flex:none;width:44px;height:44px;border-radius:50%;
  border:0;background:var(--knob);color:var(--knob-ink);
  display:grid;place-items:center;cursor:pointer;
}
.play svg{width:16px;height:16px}
.play .i-pause{display:none}
.play[aria-pressed="true"] .i-play{display:none}
.play[aria-pressed="true"] .i-pause{display:block}

.hinge{display:flex;flex-direction:column;gap:6px;width:280px}
.hinge-row{display:flex;align-items:center;gap:12px}
.readout{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;width:38px;text-align:right}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:28px;margin:0;background:transparent;cursor:pointer;
  --p:100%;
}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--ink) 0 var(--p),var(--track) var(--p) 100%);
}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;margin-top:-7px;
  background:var(--knob);border:3px solid var(--bg-center);
}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--knob);border:3px solid var(--bg-center)}
.detents{display:flex;justify-content:space-between;padding-left:50px}
.detents button{
  border:0;background:none;padding:2px 0;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;
}
.detents button[aria-current="true"]{color:var(--ink);font-weight:500}

.sep{width:1px;align-self:stretch;background:var(--line)}
.assets{border:1px solid var(--line);background:none;font:inherit;font-size:13px;color:var(--ink);padding:8px 12px;border-radius:12px;cursor:pointer;white-space:nowrap}

.screens{display:flex;background:var(--track);border-radius:12px;padding:3px}
.screens button{
  border:0;background:none;font:inherit;font-size:13px;color:var(--muted);
  padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;
}
.screens button[aria-pressed="true"]{background:var(--knob);color:var(--knob-ink)}

.colors{display:flex;gap:8px}
.colors button{
  width:22px;height:22px;border-radius:50%;cursor:pointer;padding:0;
  border:1px solid var(--line);background:var(--sw);
  outline-offset:3px;
}
.colors button[aria-pressed="true"]{outline:1.5px solid var(--ink)}

button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 110px);
  font-size:13px;background:var(--knob);color:var(--knob-ink);
  padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;
}
.toast.show{opacity:1}

.fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:14px;color:var(--muted)}

@media (max-width:760px){
  header{left:18px}
  .hint{display:none}
  .dock{
    flex-wrap:wrap;justify-content:center;gap:12px;
    left:12px;right:12px;transform:none;max-width:none;
    bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    padding:12px;
  }
  .hinge{flex:1 1 calc(100% - 64px);min-width:0;width:auto}
  .sep{display:none}
  .screens{flex:1 1 auto}
  .screens button{flex:1;padding:7px 8px}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 190px);max-width:calc(100vw - 48px);text-align:center}
  .colors{flex:none}
}
@media (prefers-reduced-motion: reduce){
  #stage canvas,.hint,.toast{transition:none}
}
</style>
<script>if(/embed/.test(location.hash))document.documentElement.classList.add('embed');</script>
<style>
.foldbtn{display:none}
html.embed body{background:transparent}
html.embed .dock{display:none!important}
html.embed header,html.embed .hint,html.embed .toast,html.embed #assets,html.embed .dock .sep,
html.embed .play,html.embed .hinge,html.embed .colors,html.embed .screens{display:none!important}
html.embed .dock{background:none;border:0;padding:0;gap:0;-webkit-backdrop-filter:none;backdrop-filter:none;left:50%;right:auto;transform:translateX(-50%);bottom:18px;width:auto;max-width:none}
html.embed .foldbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  color:var(--ink);font:500 14px/1 var(--font);padding:11px 18px 11px 14px;border-radius:99px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.06);transition:transform .16s ease}
html.embed .foldbtn:hover{transform:translateY(-1px)}
html.embed .foldbtn:active{transform:scale(.97)}
html.embed .foldbtn svg{width:16px;height:16px}
</style>
</head>
<body>
<div id="stage" aria-label="3D model of Galaxy Z Fold8. Drag to rotate, scroll or pinch to zoom."></div>

<header>
  <h1>Galaxy Z Fold8</h1>
  <p id="spec">Open: 161.4 × 123.9 × 4.5 mm</p>
</header>
<div class="hint" id="hint">Drag to turn it around. Tap the screen to use it.</div>

<div class="dock" role="group" aria-label="Fold controls">
  <button class="foldbtn" id="foldBtn" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M8 3v10"/></svg><span>Fold</span></button>
  <button class="play" id="play" aria-pressed="false" aria-label="Play fold loop">
    <svg class="i-play" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11a.5.5 0 0 0 .76.43l9-5.5a.5.5 0 0 0 0-.86l-9-5.5A.5.5 0 0 0 4 2.5z"/></svg>
    <svg class="i-pause" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg>
  </button>
  <div class="hinge">
    <div class="hinge-row">
      <span class="readout" id="readout">180°</span>
      <input type="range" id="angle" min="0" max="180" step="0.5" value="180" aria-label="Hinge angle">
    </div>
    <div class="detents">
      <button data-deg="0">Closed</button>
      <button data-deg="180">Open</button>
    </div>
  </div>
  <div class="sep"></div>
  <div class="screens" role="group" aria-label="Screen">
    <button data-app="home" aria-pressed="true">Home</button>
    <button data-app="chrome" aria-pressed="false">Chrome</button>
  </div>
  <button class="assets" id="assets">Add assets</button>
  <div class="colors" role="group" aria-label="Color">
    <button data-color="pistachio" aria-pressed="true" aria-label="Pistachio" title="Pistachio" style="--sw:#A9CBC3"></button>
    <button data-color="lavender" aria-pressed="false" aria-label="Lavender" title="Lavender" style="--sw:#C4BCDC"></button>
    <button data-color="graphite" aria-pressed="false" aria-label="Graphite" title="Graphite" style="--sw:#3A3F42"></button>
    <button data-color="cream" aria-pressed="false" aria-label="Cream" title="Cream" style="--sw:#E8E1D1"></button>
  </div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<div class="toast" id="toast" role="status"></div>
<div class="fallback" id="fallback">This prototype needs WebGL 2. Open it in a current version of Chrome, Safari, Samsung Internet or Firefox.</div>

<script src="three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Device dimensions, in millimetres ----------
// Galaxy Z Fold8 spec: unfolded 161.4 W x 123.9 H x 4.5 D, folded 81.9 W x 123.9 H x 9.7 D.
// Feature positions (camera, keys, punch holes, bezels, corner radius) measured from the official renders.
const H = 123.9;         // height
const W = 80.7;          // width of one half (161.4 / 2)
const T = 4.5;           // thickness of one half
const ZP = 4.85;         // hinge pivot height: closed stack = 2 x ZP = 9.7
const S = 1.2;           // half-width of the flexing band; also how far the spine sits out when closed (81.9 - 80.7)
const RE = 1.0;          // how far the frame edge rounds in from the outline
const RE_TOP = 1.15;     // screen-side edge: taller, sloped bevel (Samsung's opening gap)
const RE_BOT = 0.55;     // back-side edge: tight
const RC = 3.0;          // outer corner radius
const Wc = W - RE, Hc = H / 2 - RE, Rc = RC - RE;   // cap outline (inside the frame edge)
// inner display: 4:3, active area ~3.0 mm in from the sides, 3.2 mm from top and bottom
const INNER = { hw: W - 3.0, hh: H / 2 - 3.2, r: 1.2, hole: [40.4, H / 2 - 7.2, 1.5] };
// cover display: 10:16, spans from ~3 mm off the hinge to 3.2 mm off the outer edge
const COVER_X0 = 3.0, COVER_X1 = W - 3.2;
const COVER = { cx: (COVER_X0 + COVER_X1) / 2, hw: (COVER_X1 - COVER_X0) / 2, hh: H / 2 - 3.2, r: 1.2, hole: [(COVER_X0 + COVER_X1) / 2, H / 2 - 6.9, 1.6] };

// Fold8 colorways: Pistachio (Samsung.com exclusive), Lavender, Graphite, Cream.
// Pistachio is sampled from the official renders; the others are matched by eye and should be checked against product shots.
const COLORS = {
  pistachio: { metal: .92, frame: 0xA3C7BE, back: 0xBCCFCB, spine: 0x9FC3BA, backRough: .5,
               wall: ['#4FB3AE', '#AEE0C3', '#F7E3A8'], bands: [['#3FA9A6', '#8FD8B3'], ['#7ACFB0', '#CFEAB0'], ['#F2DDA0', '#BFE2C0']] },
  lavender:  { metal: .85, frame: 0xC4BDDC, back: 0xD3CDE6, spine: 0xB8B0D2, backRough: .5,
               wall: ['#8E86C8', '#CFC6EC', '#F6DCD6'], bands: [['#7A70C0', '#B9ACE6'], ['#A99BE0', '#E6D2F0'], ['#F3CFC4', '#D6C8EE']] },
  graphite:  { metal: .92, frame: 0x3E4346, back: 0x34393C, spine: 0x3A3F42, backRough: .55,
               wall: ['#161B20', '#2B343C', '#4E5A63'], bands: [['#1B242C', '#3A4955'], ['#3E4D58', '#5E6E7A'], ['#5A6873', '#34414B']] },
  cream:     { metal: .72, frame: 0xEEE7D6, back: 0xEEE8DA, spine: 0xDDD4C2, backRough: .45,
               wall: ['#D9C6A5', '#F1E7D2', '#F7E6DC'], bands: [['#CDB48C', '#EAD9B8'], ['#E6D3B3', '#FAF0DE'], ['#F1D6C8', '#EADFC9']] },
};
let colorName = 'pistachio';

// ---------- Renderer ----------
const stage = $('#stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) throw new Error('webgl1');
} catch (e) {
  $('#fallback').style.display = 'grid'; $('.dock').style.display = 'none'; return;
}
const isMobile = matchMedia('(pointer: coarse)').matches;
let dpr = Math.min(devicePixelRatio || 1, isMobile ? 1.75 : 2);
renderer.setPixelRatio(dpr);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 10, 4000);

// Studio environment: a grey room with soft light panels, prefiltered once.
(function buildEnvironment() {
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(60, 30, 60), new THREE.MeshBasicMaterial({ color: 0x8e9391, side: THREE.BackSide }));
  env.add(room);
  const panel = (w, h, x, y, z, ry, rx, k) => {
    const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 1, 1).multiplyScalar(k), side: THREE.DoubleSide });
    const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
    p.position.set(x, y, z); p.rotation.set(rx, ry, 0); env.add(p);
  };
  panel(30, 14, 0, 14.5, 4, 0, Math.PI / 2, 2.4);       // overhead softbox
  panel(4, 22, -26, 2, 6, Math.PI / 2, 0, 5.0);         // left strip
  panel(4, 22, 26, 2, -4, -Math.PI / 2, 0, 3.6);        // right strip
  panel(18, 8, 0, 3, 29, Math.PI, 0, 1.4);              // front fill
  panel(22, 10, 4, 5, -29, 0, 0, 2.6);                  // back kicker
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.03).texture;
  pmrem.dispose();
})();

// ---------- Fold deformation (one uniform drives every flexing mesh) ----------
const foldU = { value: Math.PI };   // 0 = open flat, PI = closed
const FOLD_GLSL = `
uniform float uFold;
const float FS = ${S.toFixed(4)};
const float FZP = ${ZP.toFixed(4)};
const float FK = 1.0;   // tangent scale when closed: keeps the spine face flat with rounded corners
vec2 fRot(vec2 p, float c, float s){
  vec2 q = vec2(p.x, p.y - FZP);
  return vec2(c*q.x + s*q.y, -s*q.x + c*q.y + FZP);
}
// returns folded (x, z) and the cos/sin of the local bend used to rotate normals
// (no atan: some GPUs return NaN for atan(0, x), which drops the hinge triangles when flat)
vec4 foldDeform(vec3 p){
  float c = cos(uFold), s = sin(uFold);
  if (p.x >= FS) return vec4(p.x, p.z, 1.0, 0.0);
  if (p.x <= -FS) return vec4(fRot(p.xz, c, s), c, s);
  float t = (p.x + FS) / (2.0*FS);
  vec2 A = fRot(vec2(-FS, p.z), c, s);
  vec2 B = vec2(FS, p.z);
  float m = mix(2.0*FS, FK*length(B - A), uFold / 3.14159265);
  vec2 dA = vec2(c, -s) * m, dB = vec2(m, 0.0);
  float t2 = t*t, t3 = t2*t;
  vec2 P = (2.*t3-3.*t2+1.)*A + (t3-2.*t2+t)*dA + (-2.*t3+3.*t2)*B + (t3-t2)*dB;
  vec2 D = (6.*t2-6.*t)*A + (3.*t2-4.*t+1.)*dA + (-6.*t2+6.*t)*B + (3.*t2-2.*t)*dB;
  vec2 dn = D / max(length(D), 1e-6);
  return vec4(P, dn.x, -dn.y);
}
`;

function makeFoldable(material, key, screen) {
  material.onBeforeCompile = sh => {
    sh.uniforms.uFold = foldU;
    let vHead = FOLD_GLSL;
    if (screen) {
      Object.assign(sh.uniforms, screen.uniforms);
      vHead += 'attribute vec2 screenUv;\nvarying vec2 vScr;\n';
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\n' + SCREEN_FRAG_HEAD)
        .replace('#include <emissivemap_fragment>', screen.cover ? COVER_FRAG : INNER_FRAG);
    }
    sh.vertexShader = vHead + sh.vertexShader
      .replace('#include <beginnormal_vertex>', `
        vec4 fdef = foldDeform(position);
        float fc = fdef.z, fs = fdef.w;
        vec3 objectNormal = vec3(fc*normal.x + fs*normal.z, normal.y, -fs*normal.x + fc*normal.z);
        #ifdef USE_TANGENT
          vec3 objectTangent = vec3(tangent.xyz);
        #endif`)
      .replace('#include <begin_vertex>', `
        vec3 transformed = vec3(fdef.x, position.y, fdef.y);
        ${screen ? 'vScr = screenUv;' : ''}`);
  };
  material.customProgramCacheKey = () => 'fold-' + key;
  return material;
}

// Screen shading: display area, bezel, punch hole, dimming and blur all computed per pixel.
// Each screen composes three static textures (home, app chrome, web page). The app-launch
// animation, page scrolling and fold blur all happen here, so nothing is re-uploaded while moving.
const SCREEN_FRAG_HEAD = `
varying vec2 vScr;
uniform sampler2D uHome, uApp, uPage;
uniform vec4 uRect;      // centre x, centre y, half width, half height of the active area (mm)
uniform vec4 uHole;      // x, y, radius (mm)
uniform float uRadius, uBright, uBlur, uMirror;
uniform float uLaunch;   // 0 = home, 1 = app fully open
uniform vec4 uWin;       // app window: centre + half size, in top-down screen uv
uniform float uWinR;     // window corner radius (mm)
uniform vec4 uIcon;      // launching icon: centre + half size, top-down uv
uniform float uBarTop, uBarBot, uScroll, uPageSpan;
float sdRoundRect(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q,0.0)) + min(max(q.x,q.y),0.0) - r; }
vec3 tx(sampler2D t, vec2 s, float b){ return texture(t, vec2(s.x, 1.0 - s.y), b - 0.85).rgb; }   // -0.85: sample a sharper mip level, so the UI stays legible when the phone is small on the page
vec3 appAt(vec2 s, float b){
  float py = uScroll + (s.y - uBarTop) / (uBarBot - uBarTop) * uPageSpan;
  vec3 ui = tx(uApp, s, b);
  vec3 pg = tx(uPage, vec2(s.x, clamp(py, 0.0, 1.0)), b);
  float inPage = step(uBarTop, s.y) * step(s.y, uBarBot);
  return mix(ui, pg, inPage);
}
vec3 compose(vec2 s, float b){
  // home zooms in slightly and dims as the app opens
  float hs = 1.0 + 0.04 * uLaunch;
  vec3 home = tx(uHome, (s - 0.5) / hs + 0.5, b) * (1.0 - 0.35 * uLaunch);
  if (uWin.z <= 0.0) return home;
  vec2 mm = 2.0 * uRect.zw;
  float sd = sdRoundRect((s - uWin.xy) * mm, uWin.zw * mm, uWinR);
  float aa = fwidth(sd) * 0.75 + 1e-4;
  float inside = 1.0 - smoothstep(-aa, aa, sd);
  vec2 q = (s - uWin.xy) / max(uWin.zw, vec2(1e-5));
  vec3 iconC = tx(uHome, uIcon.xy + q * uIcon.zw, b);
  vec3 appC = appAt(q * 0.5 + 0.5, b);
  vec3 win = mix(iconC, appC, smoothstep(0.06, 0.5, uLaunch));
  return mix(home, win, inside);
}
vec3 screenColor(){
  vec2 p = vec2(mix(vScr.x, -vScr.x, uMirror), vScr.y);
  vec2 lp = p - uRect.xy;
  float d = sdRoundRect(lp, uRect.zw, uRadius);
  float aa = fwidth(d) * 0.75;
  float mask = 1.0 - smoothstep(-aa, aa, d);
  float hd = length(p - uHole.xy) - uHole.z;
  mask *= smoothstep(-aa, aa, hd);

// ---------- Screen content: One UI home screens and Chrome ----------
// App icons are never drawn here. Each slot shows a neutral placeholder until the matching
// icon file is added with "Add assets" (e.g. chrome.png, play-store.png).
const ASSETS = {};
let wallAsset = null, pageAsset = null, pageMobileAsset = null;
const APP_NAMES = {
  'creative-studio': 'Creative studio', health: 'Health', wearable: 'Wearable', notes: 'Notes',
  gallery: 'Gallery', settings: 'Settings', calendar: 'Calendar', gemini: 'Gemini',
  store: 'Store', 'gaming-hub': 'Gaming Hub', 'play-store': 'Play Store', google: 'Google',
  facebook: 'Facebook', instagram: 'Instagram', tiktok: 'TikTok', smartthings: 'SmartThings',
  phone: 'Phone', messages: 'Messages', chrome: 'Chrome', camera: 'Camera',
  clock: 'Clock', calculator: 'Calculator', files: 'My Files', youtube: 'YouTube',
};
// the Google folder on the home screen shows these as a 3×3 grid
const FOLDER_APPS = ['google-g', 'gmail', 'maps', 'youtube', 'drive', 'photos', 'meet', 'google-tv', 'gemini'];
const ALIASES = {
  googlemaps: 'maps', googledrive: 'drive', googlephotos: 'photos', googlemeet: 'meet', googletv: 'google-tv',
  galaxystore: 'store', samsunghealth: 'health', googleplay: 'play-store', googleplaystore: 'play-store',
  galaxywearable: 'wearable', samsungnotes: 'notes', googlechrome: 'chrome', googlegemini: 'gemini',
  samsunggallery: 'gallery', samsungcalendar: 'calendar', samsungmessages: 'messages', googlemessages: 'messages',
  googleg: 'google-g', glogo: 'google-g', googlesearch: 'google-g',
  page: 'page', pagemobile: 'page-mobile', webpage: 'page', wallpaper: 'wallpaper',
};
function slugFor(filename) {
  const k = filename.replace(/\.[a-z0-9]+$/i, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (ALIASES[k]) return ALIASES[k];
  for (const s of [...Object.keys(APP_NAMES), ...FOLDER_APPS]) if (s.replace(/-/g, '') === k) return s;
  return null;
}
// full-bleed square art gets the squircle mask; pre-shaped icons draw as-is; bare logos sit on a white squircle
function iconKind(img) {
  const c = mkCanvas(32, 32), x = c.getContext('2d');
  x.drawImage(img, 0, 0, 32, 32);
  const d = x.getImageData(0, 0, 32, 32).data, a = (i, j) => d[(j * 32 + i) * 4 + 3];
  if (a(1, 1) > 200 && a(30, 1) > 200 && a(1, 30) > 200 && a(30, 30) > 200) return 'bleed';
  if (a(4, 4) > 160 && a(27, 27) > 160) return 'shaped';
  return 'logo';
}

const FONT = 'Onest, "Segoe UI", Roboto, sans-serif';
const font = (wt, px) => `${wt} ${Math.round(px)}px ${FONT}`;
const uiInk = (a = 1) => colorName === 'graphite' ? `rgba(242,244,246,${a})` : `rgba(26,28,36,${a})`;
const clamp01 = v => Math.min(1, Math.max(0, v));
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function squircle(ctx, cx, cy, s) {
  const n = 4.6, a = s / 2;
  ctx.beginPath();
  for (let i = 0; i <= 96; i++) {
    const t = i / 96 * Math.PI * 2, c = Math.cos(t), sn = Math.sin(t);
    const x = Math.sign(c) * Math.pow(Math.abs(c), 2 / n) * a, y = Math.sign(sn) * Math.pow(Math.abs(sn), 2 / n) * a;
    i ? ctx.lineTo(cx + x, cy + y) : ctx.moveTo(cx + x, cy + y);
  }
  ctx.closePath();
}
function drawContain(ctx, img, x, y, w, h) {
  const r = Math.min(w / img.width, h / img.height), dw = img.width * r, dh = img.height * r;
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}
function drawCoverFit(ctx, img, w, h) {
  const r = Math.max(w / img.width, h / img.height), dw = img.width * r, dh = img.height * r;
  ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
}
function fitText(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text; while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
const initials = name => { const w = name.split(/\s+/); return w.length > 1 ? (w[0][0] + w[1][0]).toUpperCase() : name.slice(0, 2); };

function drawFolder(ctx, cx, cy, s) {
  ctx.save();
  squircle(ctx, cx, cy, s);
  ctx.fillStyle = colorName === 'graphite' ? 'rgba(150,152,158,0.62)' : 'rgba(176,178,184,0.62)'; ctx.fill();
  const m = s * 0.235, step = s * 0.265;
  FOLDER_APPS.forEach((slug, i) => {
    const x = cx + ((i % 3) - 1) * step, y = cy + (Math.floor(i / 3) - 1) * step, a = ASSETS[slug];
    if (a) drawContain(ctx, a.img, x - m / 2, y - m / 2, m, m);
    else { ctx.fillStyle = 'rgba(30,34,46,0.18)'; ctx.beginPath(); ctx.arc(x, y, m * 0.32, 0, 7); ctx.fill(); }
  });
  ctx.restore();
}
function drawAppIcon(ctx, slug, cx, cy, s) {
  if (slug === 'google') return drawFolder(ctx, cx, cy, s);
  const a = ASSETS[slug];
  ctx.save();
  squircle(ctx, cx, cy, s);
  if (a && a.kind === 'bleed') { ctx.clip(); drawCoverFitRect(ctx, a.img, cx - s / 2, cy - s / 2, s, s); }
  else if (a && a.kind === 'shaped') {
    drawContain(ctx, a.img, cx - s / 2, cy - s / 2, s, s);
    if (slug === 'calendar') {
      // repaint the day and date so the icon shows today, like the live One UI calendar icon
      const k = s / 192, x0 = cx - s / 2, y0 = cy - s / 2, d = new Date();
      ctx.fillStyle = '#03C1BA'; ctx.fillRect(x0 + 44 * k, y0 + 15 * k, 104 * k, 44 * k);
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x0 + 34 * k, y0 + 68 * k, 124 * k, 112 * k);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#FFFFFF'; ctx.font = font(700, 30 * k); ctx.fillText(d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase(), cx, y0 + 38 * k);
      ctx.fillStyle = '#111111'; ctx.font = font(600, 78 * k); ctx.fillText(String(d.getDate()), cx, y0 + 124 * k);
    }
  }
  else if (a) { ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.clip(); const m = s * 0.7; drawContain(ctx, a.img, cx - m / 2, cy - m / 2, m, m); }
  else {
    ctx.fillStyle = 'rgba(255,255,255,0.62)'; ctx.fill();
    ctx.lineWidth = Math.max(1, s * 0.012); ctx.strokeStyle = 'rgba(20,24,36,0.10)'; ctx.stroke();
    ctx.fillStyle = 'rgba(30,34,46,0.55)'; ctx.font = font(600, s * 0.3); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(initials(APP_NAMES[slug] || slug), cx, cy + s * 0.01);
  }
  ctx.restore();
}
function drawCoverFitRect(ctx, img, x, y, w, h) {
  const r = Math.max(w / img.width, h / img.height), dw = img.width * r, dh = img.height * r;
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}
function placeIcon(ctx, L, slug, cx, cy, s, labelPx) {
  drawAppIcon(ctx, slug, cx, cy, s);
  if (labelPx) {
    ctx.save(); ctx.font = font(500, labelPx); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = uiInk(0.92);
    if (colorName === 'graphite') { ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = labelPx * 0.25; ctx.shadowOffsetY = labelPx * 0.04; }
    ctx.fillText(APP_NAMES[slug], cx, cy + s * 0.6); ctx.restore();
  }
  L.icons.push({ slug, cx, cy, s });
}

// frosted widget base: blurred wallpaper under a translucent tint, like One UI's launcher blur
const canFilter = 'filter' in CanvasRenderingContext2D.prototype;
function frosted(ctx, wall, x, y, w, h, r, tint) {
  ctx.save(); rr(ctx, x, y, w, h, r); ctx.clip();
  if (canFilter) {
    const m = Math.round(Math.min(w, h) * 0.3);
    const sx = Math.max(0, x - m), sy = Math.max(0, y - m), sw = Math.min(wall.width - sx, w + 2 * m), sh = Math.min(wall.height - sy, h + 2 * m);
    ctx.filter = `blur(${Math.round(Math.min(w, h) * 0.12)}px)`;
    ctx.drawImage(wall, sx, sy, sw, sh, sx, sy, sw, sh);
    ctx.filter = 'none';
  }
  ctx.fillStyle = tint; ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function timeStr() { const d = new Date(); return `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`; }
function dateLines() {
  const d = new Date();
  return [d.toLocaleDateString('en-US', { weekday: 'short' }) + ',', d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })];
}
function statusBar(ctx, x0, x1, y, px, ink, inv) {
  ctx.save();
  ctx.fillStyle = ink; ctx.strokeStyle = ink;
  ctx.font = font(500, px); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(timeStr(), x0, y + px * 0.04);
  const bw = px * 1.75, bh = px * 1.12, bx = x1 - bw;
  rr(ctx, bx, y - bh / 2, bw, bh, bh / 2); ctx.fill();
  ctx.fillStyle = inv; ctx.font = font(600, px * 0.74); ctx.textAlign = 'center';
  ctx.fillText('91', bx + bw / 2, y + px * 0.04);

// ----- wallpaper -----
function wallpaper(ctx, w, h) {
  const g = ctx.createLinearGradient(0, h, w, 0);
  const pal = COLORS[colorName];
  g.addColorStop(0, pal.wall[0]); g.addColorStop(0.45, pal.wall[1]); g.addColorStop(1, pal.wall[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    gr.addColorStop(0, c0); gr.addColorStop(1, c1);
    ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = gr; ctx.lineCap = 'round';
    ctx.lineWidth = width * h;

    ctx.stroke();

    ctx.stroke(); ctx.restore();

  const b = pal.bands;

  band([[0.26, -0.15], [0.02, 0.62], [0.74, 0.5], [0.86, 1.2]], 0.24, b[1][0], b[1][1], 0.5);
  band([[1.15, 0.78], [0.8, 0.4], [0.62, 1.05], [0.35, 1.25]], 0.3, b[2][0], b[2][1], 0.45);
  const rg = ctx.createRadialGradient(w * 0.2, h * 0.1, 0, w * 0.2, h * 0.1, h * 0.8);
  rg.addColorStop(0, 'rgba(255,255,255,.28)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);
}

  const I = SCREENS.inner, C = SCREENS.cover, ic = I.wall.getContext('2d');

// ----- home screens (layouts measured from Fold8 photos running One UI 9) -----
const GRID_ROWS = [['clock', 'health', 'wearable', 'notes'], ['gallery', 'settings', 'calendar', 'gemini'], ['store', 'calculator', 'play-store', 'google']];
const DOCK = ['phone', 'messages', 'chrome', 'camera'];
// Home-screen grid: square cells of pitch P with tiles of size S, so the gap g = P - S is the same
// between icons, between widgets and between widgets and icons, horizontally and vertically.
// Widgets span whole cells, so their edges line up with the icon tiles in the same columns and rows.
function homeGrid(w, cols, P, S, T0) {
  const g = P - S, M = (w - (cols * P - g)) / 2;
  const x = c => M + c * P, y = r => T0 + r * P;
  return {
    P, S, g, M,
    x, y,
    span: (c, r, cs, rs) => [x(c), y(r), cs * P - g, rs * P - g],
    cx: c => x(c) + S / 2, cy: r => y(r) + S / 2,
    right: c => x(c) + S,
  };
}
const HOME = {
  inner: { cols: 8, P: 218, S: 132, T0: 104, label: 29 },   // texture px on the 2048-wide main screen
  cover: { cols: 4, P: 216, S: 136, T0: 120, label: 30 },   // texture px on the 1014-wide cover screen
};
function paintHomeCommon(s, G, spec, rows, searchSpan, dockCols, navSpan) {
  const ctx = s.home.getContext('2d'), w = s.w, h = s.h, L = s.layout;
  L.icons = [];

  nowBrief(ctx, s.wall, ...G.span(0, 0, 2, 2));

  rows.forEach((row, r) => row.forEach((slug, c) => placeIcon(ctx, L, slug, G.cx(c), G.cy(r + 2), G.S, spec.label)));
  // search bar sits one cell below the last icon row, spanning whole columns
  const sy = G.y(5), sh = Math.round(G.S * 0.66);
  searchBar(ctx, s.wall, G.x(searchSpan[0]), sy, G.right(searchSpan[1]) - G.x(searchSpan[0]), sh);

  const nx0 = G.x(navSpan[0]), nx1 = G.right(navSpan[1]), ny = navSpan[2] ?? dy;

  const rows = [GRID_ROWS[0], GRID_ROWS[1], [...GRID_ROWS[2], 'files', 'instagram', 'tiktok', 'smartthings']];

    if (!gesture.moved && performance.now() - gesture.t0 < 450 && gesture.hit && gesture.hit.inside) handleTap(gesture.hit);
    if (gesture.scroll && performance.now() - gesture.lt > 90) app.vel = 0;
    app.dragging = false; gesture = null; dirty = true;
  }
  if (!pointers.size) { stage.classList.remove('dragging'); if (performance.now() - lastMove > 80) view.vYaw = view.vPitch = 0; }
  if (pointers.size < 2) pinchStart = 0;
};
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('wheel', e => {
  // wheel over an open app scrolls the page; elsewhere it zooms
  const hit = app.open && !app.anim ? screenHit(e.clientX, e.clientY) : null;
  // embedded in a page: let the wheel scroll the host page unless it's scrolling the phone's own screen
  if (document.documentElement.classList.contains('embed') && !(hit && hit.inside)) return;
  e.preventDefault();
  if (hit && hit.inside) { app.scroll = clamp01(app.scroll + e.deltaY / maxScroll(hit.sc)); app.vel = 0; }
  else view.tZoom = clampZoom(view.tZoom * Math.exp(e.deltaY * 0.0012));
  dirty = true; hideHint();
}, { passive: false });
stage.addEventListener('dblclick', e => { if (screenHit(e.clientX, e.clientY)?.inside) return; view.tYaw = DEFAULT_VIEW.yaw; view.tPitch = DEFAULT_VIEW.pitch; view.tZoom = 1; dirty = true; });
const clampPitch = v => Math.max(-1.25, Math.min(1.25, v));
const clampZoom = v => Math.max(0.55, Math.min(1.9, v));

function frameFor(phi) {
  const c = Math.cos(phi), s = Math.sin(phi);
  const tipX = -W * c + (T / 2 - ZP) * s, tipZ = W * s + (T / 2 - ZP) * c + ZP;
  const minX = Math.min(tipX, -S), maxX = W + 1;
  const minZ = Math.min(-2.5, tipZ), maxZ = Math.max(T, tipZ + T / 2);
  return { cx: (minX + maxX) / 2, cz: (minZ + maxZ) / 2, w: maxX - minX, d: maxZ - minZ };
}
function stepCamera(dt) {
  if (!pointers.size && (Math.abs(view.vYaw) > 1e-5 || Math.abs(view.vPitch) > 1e-5)) {
    view.tYaw += view.vYaw; view.tPitch = clampPitch(view.tPitch + view.vPitch);
    const decay = Math.exp(-dt * 5.5); view.vYaw *= decay; view.vPitch *= decay;
  }
  const k = 1 - Math.exp(-dt * 10);
  const before = view.yaw + view.pitch + view.zoom;
  view.yaw += (view.tYaw - view.yaw) * k;
  view.pitch += (view.tPitch - view.pitch) * k;
  view.zoom += (view.tZoom - view.zoom) * k;

  const f = frameFor(fold);
  phone.position.set(-f.cx, 0, -f.cz);
  const aspect = camera.aspect, tanV = Math.tan(camera.fov * DEG / 2);
  const rxz = 0.5 * Math.hypot(f.w, f.d);
  const need = Math.max((H / 2) / tanV, rxz / (tanV * aspect)) * 1.32 + rxz * 0.35;
  view.dist = view.dist ? view.dist + (need - view.dist) * (1 - Math.exp(-dt * 8)) : need;
  const d = view.dist * view.zoom;
  camera.position.set(Math.sin(view.yaw) * Math.cos(view.pitch) * d, Math.sin(view.pitch) * d, Math.cos(view.yaw) * Math.cos(view.pitch) * d);
  // keep the dock from covering the device
  camera.lookAt(0, -H * 0.04, 0);
  return Math.abs(before - (view.yaw + view.pitch + view.zoom)) > 1e-6 || Math.abs(need - view.dist) > 1e-3;
}

// ---------- UI ----------
const specLine = $('#spec');
const slider = $('#angle'), readout = $('#readout'), playBtn = $('#play');
const detents = [...document.querySelectorAll('.detents button')];
function stopPlay() { playing = false; playBtn.setAttribute('aria-pressed', 'false'); playBtn.setAttribute('aria-label', 'Play fold loop'); }
playBtn.addEventListener('click', () => {
  if (playing) { stopPlay(); goTo(Math.round(toDeg(fold)), 0.01); return; }
  tween = null; playing = true;
  // start the loop at the phase nearest the current angle so there is no jump
  const cur = toDeg(fold); let best = 0, bestD = 1e9;
  for (let t = 0; t < LOOP_LEN; t += 0.02) { const dd = Math.abs(toDeg(loopTarget(t)) - cur); if (dd < bestD) { bestD = dd; best = t; } }
  playT = best;
  playBtn.setAttribute('aria-pressed', 'true'); playBtn.setAttribute('aria-label', 'Pause fold loop');
  dirty = true;
});
slider.addEventListener('input', () => {
  stopPlay(); tween = null; sliderDragging = true;
  foldTarget = toPhi(+slider.value); dirty = true;
});
slider.addEventListener('change', () => {
  sliderDragging = false;
  const v = +slider.value;
  // Fold8 has no Flex Mode: the hinge doesn't hold part-way, so a release settles it
  if (v > 0 && v < 180) {
    const to = v < 120 ? 0 : 180;
    goTo(to, 0.25 + 0.5 * Math.abs(to - v) / 180);
    if (!flexNoted) { flexNoted = true; toast('Fold8 has no Flex Mode, so the hinge settles open or shut when you let go.'); }
  }
});
detents.forEach(b => b.addEventListener('click', () => { stopPlay(); goTo(+b.dataset.deg); dirty = true; }));

function syncUI() {
  const deg = toDeg(fold);
  if (!sliderDragging) slider.value = deg.toFixed(1);
  const shown = Math.round(sliderDragging ? +slider.value : deg);
  readout.textContent = shown + '°';
  slider.style.setProperty('--p', (100 * (sliderDragging ? +slider.value : deg) / 180) + '%');
  const state = shown >= 175 ? 'open' : shown <= 5 ? 'closed' : '';
  slider.setAttribute('aria-valuetext', `${shown} degrees${state ? ', ' + state : ''}`);
  detents.forEach(b => b.setAttribute('aria-current', String(
    (b.dataset.deg === '0' && state === 'closed') || (b.dataset.deg === '180' && state === 'open'))));
  specLine.textContent = deg > 90 ? 'Open: 161.4 × 123.9 × 4.5 mm' : 'Closed: 81.9 × 123.9 × 9.7 mm';
  const fl = toDeg(foldTarget) > 90 ? 'Fold' : 'Unfold';
  if (foldLabel.textContent !== fl) foldLabel.textContent = fl;
}
const foldBtn = $('#foldBtn'), foldLabel = foldBtn.querySelector('span');
foldBtn.addEventListener('click', () => { stopPlay(); goTo(toDeg(foldTarget) > 90 ? 0 : 180, 1.1); dirty = true; hideHint(); });

const fileInput = $('#file');
const appBtns = [...document.querySelectorAll('.screens button')];
appBtns.forEach(b => b.addEventListener('click', () => b.dataset.app === 'chrome' ? openChrome() : closeChrome()));
function setAppButtons() { appBtns.forEach(b => b.setAttribute('aria-pressed', String((b.dataset.app === 'chrome') === app.open))); }
$('#assets').addEventListener('click', () => {
  toast('Name files by app, like chrome.png or play-store.png. page.png sets the web page, wallpaper.jpg the wallpaper.');
  fileInput.click();
});
fileInput.addEventListener('change', async () => {
  const files = [...fileInput.files]; fileInput.value = '';
  const matched = [], skipped = [];
  await Promise.all(files.map(f => new Promise(res => {
    const slug = slugFor(f.name);
    if (!slug) { skipped.push(f.name); return res(); }
    const img = new Image();
    img.onload = () => {
      if (slug === 'wallpaper') wallAsset = img;
      else if (slug === 'page') pageAsset = img;
      else if (slug === 'page-mobile') pageMobileAsset = img;
      else ASSETS[slug] = { img, kind: iconKind(img) };
      matched.push(slug); res();
    };
    img.onerror = () => { skipped.push(f.name); res(); };
    img.src = URL.createObjectURL(f);
  })));
  paintAll();
  toast(`Added ${matched.length} file${matched.length === 1 ? '' : 's'}.` + (skipped.length ? ` Didn't recognise: ${skipped.slice(0, 3).join(', ')}${skipped.length > 3 ? '…' : ''}` : ''));
});
document.querySelectorAll('.colors button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.colors button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  applyColor(b.dataset.color);
}));

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }
let hintHidden = false;
function hideHint() { if (!hintHidden) { hintHidden = true; $('#hint').classList.add('gone'); } }

addEventListener('keydown', e => {
  if (e.target.closest('input,button')) return;
  if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { stopPlay(); goTo(Math.max(0, Math.min(180, Math.round(toDeg(foldTarget)) + (e.key === 'ArrowRight' ? 15 : -15))), 0.3); }
});

// ---------- Resize, render on demand, adaptive resolution ----------
let dirty = true;
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix(); dirty = true;
  try { renderer.render(scene, camera); } catch (e) {}   // a resized canvas is blank until drawn: draw now, not next frame
}
addEventListener('resize', resize);
resize();

let last = performance.now(), frameEMA = 16, slowFrames = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const foldMoving = stepFold(dt);
  const camMoving = stepCamera(dt);
  const appMoving = stepApp(dt);
  if (foldMoving || camMoving || appMoving || dirty) {
    updateScreensForFold();
    applyAppUniforms();
    syncUI();
    renderer.render(scene, camera);
    dirty = false;
    // drop resolution in small steps if the device can't hold ~45fps while animating
    frameEMA += ((now - (loop.prev || now)) - frameEMA) * 0.1;
    // (resizing the canvas clears it, so redraw in the same frame: otherwise each step shows one blank frame, a visible blink)
    if (frameEMA > 28 && dpr > 1.5) { if (++slowFrames > 90) { dpr = Math.max(1.5, dpr - 0.25); renderer.setPixelRatio(dpr); resize(); renderer.render(scene, camera); slowFrames = 0; frameEMA = 16; } }
    else slowFrames = 0;
  }
  loop.prev = now;
  requestAnimationFrame(loop);
}

// Test hook
window.fold8 = { zoom(z) { view.tZoom = clampZoom(z); dirty = true; }, open: () => openChrome(), close: () => closeChrome(), scroll(f) { app.scroll = f; dirty = true; }, set(deg) { stopPlay(); tween = null; foldTarget = fold = toPhi(deg); foldVel = 0; dirty = true; },
                 view(yaw, pitch, zoom) { view.tYaw = view.yaw = yaw; view.tPitch = view.pitch = pitch; if (zoom) view.tZoom = view.zoom = zoom; dirty = true; },
                 snapshot() { updateScreensForFold(); for (let i = 0; i < 80; i++) stepCamera(0.05); applyAppUniforms(); syncUI(); renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png'); } };

// ---------- Boot: fonts → textures → compile shaders → reveal → one unfold ----------
(async () => {
  try { await Promise.race([document.fonts.load('500 40px Onest'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  await Promise.all(Object.entries(BUILTIN_ICONS).map(([slug, src]) => new Promise(res => {
    const img = new Image();
    img.onload = () => { ASSETS[slug] = { img, kind: iconKind(img) }; res(); };
    img.onerror = res; img.src = src;
  })));
  applyColor('pistachio');   // paints every screen
  // keep the clocks honest: repaint status bars and the clock widget each minute
  setTimeout(() => { paintClockBits(); setInterval(paintClockBits, 60000); }, (60 - new Date().getSeconds()) * 1000 + 50);
  updateScreensForFold(); stepCamera(0.016);
  renderer.compile(scene, camera);
  renderer.render(scene, camera);
  stage.classList.add('ready');
  last = performance.now();
  requestAnimationFrame(loop);
  if (reduceMotion) { fold = foldTarget = 0; dirty = true; }
  else setTimeout(() => goTo(180, 1.7), 450);
  setTimeout(() => toast('Tap Chrome in the dock to open it. Drag the page to scroll.'), 2600);
})();
})();
</script>
</body>
</html>
